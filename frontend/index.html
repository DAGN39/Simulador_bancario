<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Bancario - Ingeniería Económica</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏦 Simulador Financiero</h1>
            <p>Herramienta de cálculo para Ingeniería Económica</p>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-target="tasas">Conversión de Tasas</button>
            <button class="tab-btn" data-target="simple">Interés Simple</button>
            <button class="tab-btn" data-target="compuesto">Interés Compuesto</button>
            <button class="tab-btn" data-target="prestamos">Simulador de Préstamos</button>
            <button class="tab-btn" data-target="descuento">Descuento Bancario</button>
        </nav>

        <main>
            <!-- MÓDULO 1: TASAS -->
            <section id="tasas" class="tab-content active">
                <h2>Conversión de Tasas de Interés</h2>
                <form id="form-tasas">
                    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 250px;">
                            <h3 style="color: var(--color-4); margin-bottom: 1rem; font-size: 1.1rem;">Tasa Origen</h3>
                            <div class="input-group">
                                <label>Valor (%):</label>
                                <input type="number" id="tasas-origen-valor" step="0.0001" placeholder="Ej: 24" required>
                            </div>
                            <div class="input-group">
                                <label>Tipo:</label>
                                <select id="tasas-origen-tipo">
                                    <option value="efectiva">Efectiva</option>
                                    <option value="nominal">Nominal</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Periodo / Capitalización:</label>
                                <select id="tasas-origen-periodo">
                                    <option value="1">Anual</option>
                                    <option value="2">Semestral</option>
                                    <option value="3">Cuatrimestral</option>
                                    <option value="4">Trimestral</option>
                                    <option value="12">Mensual</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Modalidad:</label>
                                <select id="tasas-origen-modalidad">
                                    <option value="vencida">Vencida</option>
                                    <option value="anticipada">Anticipada</option>
                                </select>
                            </div>
                        </div>

                        <div style="flex: 1; min-width: 250px;">
                            <h3 style="color: var(--color-4); margin-bottom: 1rem; font-size: 1.1rem;">Tasa Destino</h3>
                            <div class="input-group">
                                <label>Tipo a calcular:</label>
                                <select id="tasas-destino-tipo">
                                    <option value="efectiva">Efectiva</option>
                                    <option value="nominal">Nominal</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Periodo / Capitalización:</label>
                                <select id="tasas-destino-periodo">
                                    <option value="1">Anual</option>
                                    <option value="2">Semestral</option>
                                    <option value="3">Cuatrimestral</option>
                                    <option value="4">Trimestral</option>
                                    <option value="12">Mensual</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Modalidad:</label>
                                <select id="tasas-destino-modalidad">
                                    <option value="vencida">Vencida</option>
                                    <option value="anticipada">Anticipada</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn-calcular" onclick="simularTasa()" style="margin-top: 1.5rem;">Convertir Tasa</button>
                </form>
                <div id="resultado-tasas" class="resultado-box hidden"></div>
            </section>

            <!-- MÓDULO 2: INTERÉS SIMPLE -->
            <section id="simple" class="tab-content">
                <h2>Interés Simple</h2>
                <form id="form-simple">
                    <div class="input-group">
                        <label>¿Qué deseas calcular?</label>
                        <select id="simple-calcular" onchange="toggleSimpleFields()">
                            <option value="interes">Interés Generado</option>
                            <option value="vf">Valor Futuro (Monto)</option>
                            <option value="vp">Valor Presente (Capital)</option>
                            <option value="tasa">Tasa de Interés</option>
                            <option value="tiempo">Tiempo</option>
                        </select>
                    </div>

                    <div id="group-simple-vp" class="input-group">
                        <label>Capital Inicial / Valor Presente ($):</label>
                        <input type="number" id="simple-vp" step="0.01" placeholder="Ej: 1000000">
                    </div>
                    
                    <div id="group-simple-vf" class="input-group" style="display: none;">
                        <label>Monto Final / Valor Futuro ($):</label>
                        <input type="number" id="simple-vf" step="0.01" placeholder="Ej: 1500000">
                    </div>

                    <div id="group-simple-tasa" style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <div class="input-group" style="flex: 1;">
                            <label>Tasa de Interés (%):</label>
                            <input type="number" id="simple-tasa" step="0.01" placeholder="Ej: 3">
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label>Periodo de la Tasa:</label>
                            <select id="simple-tasa-unidad">
                                <option value="1">Anual</option>
                                <option value="2">Semestral</option>
                                <option value="4">Trimestral</option>
                                <option value="12">Mensual</option>
                                <option value="360">Diario (Comercial)</option>
                                <option value="365">Diario (Racional)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div id="group-simple-tiempo" class="input-group" style="display: flex; gap: 0.5rem;">
                        <div style="flex: 2;">
                            <label>Tiempo:</label>
                            <input type="number" id="simple-tiempo" step="0.01" placeholder="Ej: 3.5">
                        </div>
                        <div style="flex: 1;">
                            <label>Unidad Tiempo:</label>
                            <select id="simple-tiempo-unidad">
                                <option value="1">Años</option>
                                <option value="2">Semestres</option>
                                <option value="3">Cuatrimestres</option>
                                <option value="4">Trimestres</option>
                                <option value="12">Meses</option>
                                <option value="360">Días (Comercial 360)</option>
                                <option value="365">Días (Racional 365)</option>
                            </select>
                        </div>
                    </div>

                    <button type="button" class="btn-calcular" onclick="simularSimple()">Calcular</button>
                </form>
                <div id="resultado-simple" class="resultado-box hidden"></div>
            </section>

            <!-- MÓDULO 3: INTERÉS COMPUESTO -->
            <section id="compuesto" class="tab-content">
                <h2>Interés Compuesto</h2>
                <form id="form-compuesto">
                    <div class="input-group">
                        <label>¿Qué deseas calcular?</label>
                        <select id="comp-calcular" onchange="toggleCompuestoFields()">
                            <option value="vf">Valor Futuro (Monto final)</option>
                            <option value="vp">Valor Presente (Capital inicial)</option>
                            <option value="tasa">Tasa de Interés</option>
                            <option value="tiempo">Tiempo</option>
                        </select>
                    </div>

                    <div id="group-comp-monto" class="input-group">
                        <label id="lbl-comp-monto">Monto / Capital ($):</label>
                        <input type="number" id="comp-monto" step="0.01" placeholder="Ej: 20000">
                    </div>
                    <div id="group-comp-vp" class="input-group" style="display: none;">
                        <label>Capital Inicial ($):</label>
                        <input type="number" id="comp-vp" step="0.01" placeholder="Ej: 10000">
                    </div>
                    <div id="group-comp-vf" class="input-group" style="display: none;">
                        <label>Monto Final ($):</label>
                        <input type="number" id="comp-vf" step="0.01" placeholder="Ej: 12500">
                    </div>

                    <div id="group-comp-tasa" style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <div class="input-group" style="flex: 1; min-width: 200px;">
                            <label>Tasa de Interés (%):</label>
                            <input type="number" id="comp-tasa" step="0.01" placeholder="Ej: 15">
                        </div>
                        <div class="input-group" style="flex: 1; min-width: 200px;">
                            <label>Tipo:</label>
                            <select id="comp-tipo">
                                <option value="nominal">Nominal</option>
                                <option value="efectiva">Efectiva</option>
                            </select>
                        </div>
                        <div class="input-group" style="flex: 1; min-width: 200px;">
                            <label>Periodo Tasa:</label>
                            <select id="comp-periodo">
                                <option value="1">Anual</option>
                                <option value="2">Semestral</option>
                                <option value="3">Cuatrimestral</option>
                                <option value="4">Trimestral</option>
                                <option value="12">Mensual</option>
                            </select>
                        </div>
                        <div class="input-group" style="flex: 1; min-width: 200px;">
                            <label>Modalidad:</label>
                            <select id="comp-modalidad">
                                <option value="vencida">Vencida</option>
                                <option value="anticipada">Anticipada</option>
                            </select>
                        </div>
                    </div>

                    <div id="group-comp-res-tasa" style="display: none; gap: 1rem; flex-wrap: wrap; background-color: var(--color-1); padding: 1rem; border-radius: 8px;">
                        <div class="input-group" style="flex: 1; min-width: 200px;">
                            <label>Convertir Tasa Resultante a:</label>
                            <select id="comp-res-tipo">
                                <option value="efectiva">Efectiva</option>
                                <option value="nominal">Nominal</option>
                            </select>
                        </div>
                        <div class="input-group" style="flex: 1; min-width: 200px;">
                            <label>Periodo:</label>
                            <select id="comp-res-periodo">
                                <option value="1">Anual</option>
                                <option value="2">Semestral</option>
                                <option value="4">Trimestral</option>
                                <option value="12">Mensual</option>
                            </select>
                        </div>
                    </div>

                    <div id="group-comp-tiempo" class="input-group" style="display: flex; gap: 0.5rem;">
                        <div style="flex: 2;">
                            <label>Tiempo:</label>
                            <input type="number" id="comp-tiempo" step="0.01" placeholder="Ej: 36">
                        </div>
                        <div style="flex: 1;">
                            <label>Unidad:</label>
                            <select id="comp-tiempo-unidad">
                                <option value="1">Años</option>
                                <option value="2">Semestres</option>
                                <option value="3">Cuatrimestres</option>
                                <option value="4">Trimestres</option>
                                <option value="12">Meses</option>
                            </select>
                        </div>
                    </div>

                    <button type="button" class="btn-calcular" onclick="simularCompuesto()">Calcular</button>
                </form>
                <div id="resultado-compuesto" class="resultado-box hidden"></div>
            </section>

            <!-- MÓDULO 4: PRÉSTAMOS -->
            <section id="prestamos" class="tab-content">
                <h2>Simulación de Crédito</h2>
                <form id="form-prestamos">
                    <div class="input-group">
                        <label>Monto del Préstamo ($):</label>
                        <input type="number" id="pres-monto" step="0.01" placeholder="Ej: 2400000" required>
                    </div>
                    
                    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <div class="input-group" style="flex: 1; min-width: 200px;">
                            <label>Tasa de Interés (%):</label>
                            <input type="number" id="pres-tasa" step="0.01" placeholder="Ej: 36" required>
                        </div>
                        <div class="input-group" style="flex: 1; min-width: 200px;">
                            <label>Tipo:</label>
                            <select id="pres-tipo">
                                <option value="nominal">Nominal</option>
                                <option value="efectiva">Efectiva</option>
                            </select>
                        </div>
                        <div class="input-group" style="flex: 1; min-width: 200px;">
                            <label>Periodo Tasa:</label>
                            <select id="pres-periodo">
                                <option value="1">Anual</option>
                                <option value="2">Semestral</option>
                                <option value="3">Cuatrimestral</option>
                                <option value="4">Trimestral</option>
                                <option value="12">Mensual</option>
                            </select>
                        </div>
                        <div class="input-group" style="flex: 1; min-width: 200px;">
                            <label>Modalidad:</label>
                            <select id="pres-modalidad">
                                <option value="vencida">Vencida</option>
                                <option value="anticipada">Anticipada</option>
                            </select>
                        </div>
                    </div>

                    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <div class="input-group" style="flex: 1;">
                            <label>Frecuencia de Pago:</label>
                            <select id="pres-frecuencia">
                                <option value="12">Mensual</option>
                                <option value="4">Trimestral</option>
                                <option value="3">Cuatrimestral</option>
                                <option value="2">Semestral</option>
                                <option value="1">Anual</option>
                            </select>
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label>Número de Cuotas (Plazo):</label>
                            <input type="number" id="pres-plazo" placeholder="Ej: 9" required>
                        </div>
                    </div>

                    <button type="button" class="btn-calcular" onclick="simularPrestamo()">Generar Tabla</button>
                </form>
                
                <div id="resultado-prestamos" class="resultado-box hidden">
                    <h3 id="pres-resumen" style="margin-bottom: 1rem; color: var(--color-5);"></h3>
                    <div style="max-height: 400px; overflow-y: auto; border: 1px solid var(--color-2); border-radius: 8px;">
                        <table id="tabla-amortizacion" style="width: 100%; border-collapse: collapse; text-align: right; font-size: 0.9rem;">
                            <thead style="background-color: var(--color-1); position: sticky; top: 0; z-index: 1;">
                                <tr>
                                    <th style="padding: 10px; text-align: center;">Cuota</th>
                                    <th style="padding: 10px;">Pago</th>
                                    <th style="padding: 10px;">Interés</th>
                                    <th style="padding: 10px;">Abono Capital</th>
                                    <th style="padding: 10px;">Saldo</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-amortizacion"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- MÓDULO 5: DESCUENTO BANCARIO -->
            <section id="descuento" class="tab-content">
                <h2>Descuento Bancario</h2>
                <form id="form-descuento">
                    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <div class="input-group" style="flex: 1; min-width: 250px;">
                            <h3 style="color: var(--color-4); margin-bottom: 1rem; font-size: 1.1rem;">Documento Original</h3>
                            <div class="input-group">
                                <label>Valor Inicial ($):</label>
                                <input type="number" id="desc-valor-inicial" placeholder="Ej: 70000" required>
                            </div>
                            <div class="input-group">
                                <label>Fecha de Emisión (Inicio):</label>
                                <input type="date" id="desc-fecha-inicio" required>
                            </div>
                            <div class="input-group">
                                <label>Plazo (Días):</label>
                                <input type="number" id="desc-plazo-dias" placeholder="Ej: 325" required>
                            </div>
                            <div class="input-group">
                                <label>Tasa de Interés (%):</label>
                                <input type="number" id="desc-tasa-interes" step="0.01" placeholder="Ej: 32" required>
                            </div>
                        </div>

                        <div class="input-group" style="flex: 1; min-width: 250px;">
                            <h3 style="color: var(--color-4); margin-bottom: 1rem; font-size: 1.1rem;">Descuento</h3>
                            <div class="input-group">
                                <label>Fecha de Descuento:</label>
                                <input type="date" id="desc-fecha-descuento" required>
                            </div>
                            <div class="input-group">
                                <label>Tasa de Descuento (%):</label>
                                <input type="number" id="desc-tasa-descuento" step="0.01" placeholder="Ej: 40" required>
                            </div>
                            <div class="input-group">
                                <label>Base de Días:</label>
                                <select id="desc-base-dias">
                                    <option value="360">Comercial (360 días)</option>
                                    <option value="365">Racional (365 días)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn-calcular" onclick="simularDescuento()">Calcular Descuento</button>
                </form>
                <div id="resultado-descuento" class="resultado-box hidden"></div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
